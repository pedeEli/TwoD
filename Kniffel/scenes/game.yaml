type: class TwoD::Scene
name: game

entities:
- name: camera
  components:
  - type: class TwoD::Camera
    zoom: 25

- name: dices
  components:
  - type: class Dices

screen:
- name: flex
  transform:
    anchor: BOTTOM
    size: [ 0, 100 ]
  components:
  - type: class TwoD::FlexLayout
    justify: CENTER
    align: CENTER
    gap: 20
  children:
  - prefab: TwoDLib::ColorButton
    name: roll
    components:
    - type: class TwoD::Button
      layer: 10000
      padding: [ 10, 10 ]
      background: [ 100, 100, 100, 255 ]
    - type: class TwoD::TextRenderer
      text: "Roll"
      size: 30
  - prefab: TwoDLib::ColorButton
    name: test
    components:
    - type: class TwoD::Button
      layer: 10010
      padding: [ 20, 20 ]
      background: [ 100, 0, 0, 255 ]
    - type: class TwoD::TextRenderer
      text: Hello world
      size: 50