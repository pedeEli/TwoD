name: test
renderPipeline:
- class TwoD::SpriteRenderLayer
- class TwoD::ColorRenderLayer
- class TwoD::TextRenderLayer
entities:
- name: ground
  components:
  - type: class Ground
    width: 50
    height: 30
    foliage: 1000

- name: player
  components:
  - type: class TwoD::SpriteRenderer
    sprite: protagonist
    layer: 10
  - type: class Player
    speed: 5.0
  - type: class TwoD::Hitbox
    layer: 10
    x: -0.5
    y: -0.5
    w: 1.0
    h: 1.0
  children:
  - name: camera
    components:
    - type: class TwoD::Camera
      zoom: 25

- name: iron ore vein
  components:
  - type: class Vein
    size: 40

- name: canvas
  components:
  - type: class TwoD::Canvas
  children:
  - name: button
    children:
    - name: background
      transform:
        scale: { x: 15.0, y: 3.0 }
      components:
      - type: class TwoD::ColorRenderer
        layer: 12
        renderLocation: OnScreen
        r: 255
        g: 100
        b: 100
        a: 255
    - name: text
      components:
      - type: class TwoD::TextRenderer
        layer: 13
        font: Roboto
        renderLocation: OnScreen
        text: Hello World!