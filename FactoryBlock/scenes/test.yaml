type: class TwoD::Scene
name: test
entities:
- name: tile
  components:
  - type: class Tile

- name: player
  components:
  - type: class TwoD::SpriteRenderer
    sprite: protagonist
    layer: 10
  - type: class Player
    speed: 5.0
  - type: class TwoD::Hitbox
    layer: 10
    x: -0.5
    y: -0.5
    w: 1.0
    h: 1.0
  children:
  - name: camera
    components:
    - type: class TwoD::Camera
      zoom: 25

- name: canvas
  components:
  - type: class TwoD::RectTransform
  - type: class TwoD::Canvas
  children:
  - name: button
    components:
    - type: class TwoD::RectTransform
      anchor: TOP
      size: { x: 200, y: 200 }
    - type: class TwoD::ColorRenderer
      layer: 10000
      r: 200
      g: 200
      b: 0
    children:
      - name: t
        components:
        - type: class TwoD::RectTransform
          anchor: BOTTOM_LEFT
          size: { x: 50, y: 20 }
        - type: class TwoD::ColorRenderer
          layer: 10001
          r: 100
          g: 200
          b: 200