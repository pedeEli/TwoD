type: class TwoD::Scene
name: test
entities:
- name: tile
  components:
  - type: class Tile

- name: player
  components:
  - type: class TwoD::SpriteRenderer
    sprite: protagonist
    layer: 10
  - type: class Player
    speed: 5.0
  - type: class TwoD::Hitbox
    layer: 10
    x: -0.5
    y: -0.5
    w: 1.0
    h: 1.0
  children:
  - name: camera
    components:
    - type: class TwoD::Camera
      zoom: 25

screen:
- name: button
  components:
  - type: class TwoD::Button
    anchor: TOP
    layer: 10000
    text: Hello, world!
    size: 50
    padding: { x: 10.0, y: 10.0 }
    background: { x: 0, y: 100, z: 200, w: 255 }